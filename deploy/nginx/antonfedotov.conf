server {
    listen 80;
    listen [::]:80;
    server_name antonfedotov.com www.antonfedotov.com;
    return 308 https://antonfedotov.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.antonfedotov.com;

    ssl_certificate /etc/letsencrypt/live/antonfedotov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antonfedotov.com/privkey.pem;

    return 308 https://antonfedotov.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name antonfedotov.com;

    ssl_certificate /etc/letsencrypt/live/antonfedotov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antonfedotov.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
